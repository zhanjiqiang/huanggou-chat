name: Build and Deploy

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: backend/pom.xml
    
    - name: Build with Maven
      run: |
        cd backend
        mvn clean package -DskipTests
    
    - name: Run tests
      run: |
        cd backend
        mvn test
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: huanggou-chat
        path: backend/target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          echo "🚀 开始部署黄狗一号聊天机器人..."
          
          # 进入项目目录
          cd /root/.openclaw/workspace/huanggou-chat
          
          # 拉取最新代码
          git pull origin main
          
          # 进入后端目录
          cd backend
          
          # 停止旧服务
          echo "🛑 停止旧服务..."
          pkill -f "chat-1.0.0.jar" || true
          sleep 2
          
          # 检查Java环境
          if ! command -v java &> /dev/null; then
              echo "☕ 安装Java 17..."
              apt-get update -qq
              apt-get install -y -qq openjdk-17-jre-headless
          fi
          
          # 检查Maven环境
          if ! command -v mvn &> /dev/null; then
              echo "📦 安装Maven..."
              apt-get install -y -qq maven
          fi
          
          # 构建项目
          echo "🔨 构建项目..."
          mvn clean package -DskipTests
          
          # 创建数据目录
          mkdir -p data
          
          # 启动新服务
          echo "✅ 启动新服务..."
          nohup java -jar target/chat-1.0.0.jar \
            -Xms256m -Xmx512m \
            --server.port=3001 \
            > app.log 2>&1 &
          
          # 等待服务启动
          sleep 5
          
          # 检查服务状态
          if pgrep -f "chat-1.0.0.jar" > /dev/null; then
            echo "✅ 部署成功！服务运行在 http://203.195.195.133:3001"
            echo "📋 日志文件: /root/.openclaw/workspace/huanggou-chat/backend/app.log"
          else
            echo "❌ 部署失败！请查看日志"
            tail -50 app.log
            exit 1
          fi
